apiVersion: apps/v1
kind: Deployment
metadata:
  name: quakewatch-deployment
  namespace: quakewatch
  labels:
    app: quakewatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quakewatch
  template:
    metadata:
      labels:
        app: quakewatch
    spec:
      containers:
        - name: quakewatch
          image: alexsay23/quakewatch:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: quakewatch-config
            - secretRef:
                name: quakewatch-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Readiness probe — ensures traffic only to ready pods
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # Liveness probe — restarts container if unhealthy
          livenessProbe:
            httpGet:
              path: /livez
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
